chappe:
  defaults:
    store: {type: airflow_variable}
    # The default ledger icons are standard emoji. These five custom emoji must be uploaded to your
    # Slack workspace first (Workspace settings → Customize → Emoji); otherwise delete this block.
    theme:
      tokens:
        icons:
          succeeded: ":chappe-done:"
          running: ":chappe-running:"
          pending: ":chappe-pending:"
          skipped: ":chappe-skipped:"
          failed: ":chappe-failed:"
    ui_base_url: http://localhost:8080
  processes:
    example:
      dags: [{dag_id: chappe_example}]
      channel: C0123456789   # replace with your test channel ID (C… or G…, not #name)
      title: "{{ params.product }} {{ params.version }}"
      alerts: {mention: "<@U0123456789>"}   # replace with you or a user group
