chappe:
  defaults:
    store: {type: airflow_variable}
    ui_base_url: http://localhost:8080
  processes:
    example:
      dags: [{dag_id: chappe_example}]
      channel: C0123456789   # replace with your test channel ID (C… or G…, not #name)
