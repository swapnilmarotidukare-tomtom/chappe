[project]
name = "chappe"
version = "0.0.1.dev0"
description = "Relays Apache Airflow run progress to chat: one live message per run, history in its thread."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "slack_sdk>=3.27",
]

[project.optional-dependencies]
airflow = ["apache-airflow>=3.2"]

[project.scripts]
chappe = "chappe.cli:main"

[dependency-groups]
dev = [
  "apache-airflow>=3.2,<3.3",
  "hypothesis>=6.100",
  "import-linter>=2.0",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.0",
  "ruff>=0.5",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chappe"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
mypy_path = "src"
packages = ["chappe"]

[[tool.mypy.overrides]]
module = ["airflow.*", "slack_sdk.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["integration: runs a real Airflow DAG in-process"]

[tool.importlinter]
root_package = "chappe"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core and ports stay independent of Airflow, Slack and adapters"
type = "forbidden"
source_modules = ["chappe.core", "chappe.ports"]
forbidden_modules = [
  "airflow",
  "slack_sdk",
  "chappe.integrations",
  "chappe.transports",
  "chappe.stores",
  "chappe.themes",
]

[[tool.importlinter.contracts]]
name = "adapters do not import each other (spec 12.1)"
type = "independence"
modules = ["chappe.stores", "chappe.transports"]
